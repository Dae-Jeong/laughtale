---
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: laughtale-local
servers: 1
agents: 0
image: docker.io/rancher/k3s:v1.34.10-k3s1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
ports:
  - port: 127.0.0.1:80:80
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:443:443
    nodeFilters: [loadbalancer]
options:
  k3d:
    wait: true
    timeout: 180s
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
